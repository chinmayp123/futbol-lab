# Publisher: runs the data layer every 5 minutes and writes the views to Firestore for the website
# (see publisher/publish.mjs). One pass per competition — the data layer picks its competition when
# it loads. Free — Actions minutes are unlimited on a public repo. Caveats: GitHub often starts
# scheduled runs 5–20 minutes late, and it pauses a schedule after 60 days with no commits.
name: publish
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# one run at a time: the publisher is the only writer of the records, so runs must never overlap
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      # keep in step with SITE_COMPETITIONS in competition.mjs
      COMPETITIONS: "epl laliga ucl unl"
      FUTBOL_PUBLISHER_EMAIL: ${{ secrets.FUTBOL_PUBLISHER_EMAIL }}
      FUTBOL_PUBLISHER_PASSWORD: ${{ secrets.FUTBOL_PUBLISHER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: publisher/package-lock.json
      - run: npm ci --prefix publisher

      # a competition that fails doesn't stop the others; the step still fails so it shows up
      - name: Live (free feeds only, no odds keys)
        run: |
          status=0
          for c in $COMPETITIONS; do COMPETITION=$c node publisher/publish.mjs live || status=1; done
          exit $status

      - name: Card, builder, closing prices (odds keys, rationed per competition)
        if: ${{ !cancelled() }}
        run: |
          status=0
          for c in $COMPETITIONS; do COMPETITION=$c node publisher/publish.mjs keyed || status=1; done
          exit $status
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
