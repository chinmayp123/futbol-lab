<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070b1f" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self';" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<title>Futbol Lab</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="widget compact">
    <!-- 50px broadcast title bar: logo · context line · search · back · text tabs · pin. The native
         minimize / maximize / close overlay sits at the right edge (Snap Layouts hangs off it). -->
    <header id="titlebar">
      <div class="drag">
        <span class="logo" id="home" title="Matchday">
          <svg class="logo-mark" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="fl-ball"><circle cx="50" cy="50" r="37.6"/></clipPath><clipPath id="fl-front"><rect x="-10" y="50" width="120" height="60"/></clipPath></defs><g transform="rotate(-24 50 50)"><ellipse cx="50" cy="50" rx="48" ry="15" fill="none" stroke="#4f8dff" stroke-width="3.6"/></g><circle cx="50" cy="50" r="36" fill="#ffffff"/><g clip-path="url(#fl-ball)" fill="#070b1f"><polygon points="50.00,38.50 60.94,46.45 56.76,59.30 43.24,59.30 39.06,46.45"/><polygon points="50.00,30.50 40.01,23.24 43.83,11.51 56.17,11.51 59.99,23.24"/><polygon points="68.55,43.97 72.36,32.23 84.70,32.23 88.52,43.97 78.53,51.23"/><polygon points="61.46,65.78 73.81,65.78 77.62,77.52 67.63,84.77 57.65,77.52"/><polygon points="38.54,65.78 42.35,77.52 32.37,84.77 22.38,77.52 26.19,65.78"/><polygon points="31.45,43.97 21.47,51.23 11.48,43.97 15.30,32.23 27.64,32.23"/><g stroke="#070b1f" stroke-width="2.5" stroke-linecap="round"><line x1="50.00" y1="38.50" x2="50.00" y2="30.50"/><line x1="59.99" y1="23.24" x2="72.36" y2="32.23"/><line x1="60.94" y1="46.45" x2="68.55" y2="43.97"/><line x1="78.53" y1="51.23" x2="73.81" y2="65.78"/><line x1="56.76" y1="59.30" x2="61.46" y2="65.78"/><line x1="57.65" y1="77.52" x2="42.35" y2="77.52"/><line x1="43.24" y1="59.30" x2="38.54" y2="65.78"/><line x1="26.19" y1="65.78" x2="21.47" y2="51.23"/><line x1="39.06" y1="46.45" x2="31.45" y2="43.97"/><line x1="27.64" y1="32.23" x2="40.01" y2="23.24"/></g></g><circle cx="50" cy="50" r="36" fill="none" stroke="#070b1f" stroke-width="3.2"/><g transform="rotate(-24 50 50)"><g clip-path="url(#fl-front)"><g clip-path="url(#fl-ball)"><ellipse cx="50" cy="50" rx="48" ry="15" fill="none" stroke="#070b1f" stroke-width="6.800000000000001"/></g><ellipse cx="50" cy="50" rx="48" ry="15" fill="none" stroke="#4f8dff" stroke-width="3.6"/></g></g></svg><span class="logo-txt">Futbol<span class="logo-accent">Lab</span></span>
        </span>
        <span id="subtitle" class="subtitle"></span>
        <span id="round" class="round-pill" hidden></span>
      </div>
      <div class="controls">
        <button id="fresh" class="fresh" title="Click to refresh now" hidden></button>
        <div class="search"><input id="q" type="text" placeholder="Search team   /" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" /><div id="q-results" hidden></div></div>
        <button id="back" class="navbtn off" title="Back (Esc)">&#9664;</button>
        <button id="tab-today" class="tab nav-tab" title="Every league's games, by day">Today</button>
        <button id="tab-leagues" class="tab nav-tab" title="A league: overview, table, fixtures, builder" aria-haspopup="menu"><span class="lbl">Leagues</span><svg class="caret" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 4L6 8L10 4" stroke="currentColor" stroke-width="1.8"/></svg></button>
        <button id="tab-bets" class="tab nav-tab" title="Tonight's card and the record, every league">Bets</button>
        <span class="vsep"></span>
        <button id="btn-expand" class="iconbtn" title="Expand / compact">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-pin" class="iconbtn on" title="Pin on top">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 4 H15 L14 10 L17 13 V14 H7 V13 L10 10 Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 14 V20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main id="main">
      <!-- hub header (a league's name + sub-tabs, Bets' tabs, a match's breadcrumb), then the lower
           third + crawl (match, builder); each hidden where a page doesn't use it -->
      <div id="hub" class="hub" hidden></div>
      <div id="third" class="third" hidden></div>
      <div id="ticker" class="ticker" hidden></div>
      <div id="body" class="body"></div>
    </main>

    <!-- phones (compact): the three places as a bottom bar -->
    <nav id="bnav" class="bnav">
      <button id="bn-today" class="bn"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 10H20.5M8 3V7M16 3V7" stroke="currentColor" stroke-width="1.8"/></svg><span class="lbl">Today</span></button>
      <button id="bn-leagues" class="bn" aria-haspopup="menu"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3L19.5 6V11.5C19.5 16 16.3 19.4 12 21C7.7 19.4 4.5 16 4.5 11.5V6L12 3Z" stroke="currentColor" stroke-width="1.8"/></svg><span class="lbl">Leagues</span></button>
      <button id="bn-bets" class="bn"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 7H20.5V10A2 2 0 0 0 20.5 14V17H3.5V14A2 2 0 0 0 3.5 10V7Z" stroke="currentColor" stroke-width="1.8"/><path d="M14 7V17" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2 2"/></svg><span class="lbl">Bets</span></button>
    </nav>
    <!-- the Leagues menu (filled by renderer.js) -->
    <div id="lg-menu" class="lg-menu" role="menu" hidden></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
